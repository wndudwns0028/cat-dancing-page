<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF6B35" stroke="#333" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="35" fill="#FF6B35" stroke="#333" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,55 85,35 95,55" fill="#FF6B35" stroke="#333" stroke-width="2"/>
  <polygon points="105,55 115,35 125,55" fill="#FF6B35" stroke="#333" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="78,52 83,42 88,52" fill="#FFB6C1"/>
  <polygon points="112,52 117,42 122,52" fill="#FFB6C1"/>

  <!-- Cat eyes -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#333"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#333"/>
  <ellipse cx="91" cy="72" rx="2" ry="3" fill="#FFF"/>
  <ellipse cx="111" cy="72" rx="2" ry="3" fill="#FFF"/>

  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#FFB6C1"/>

  <!-- Cat mouth -->
  <path d="M 100 90 Q 95 95 90 90" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 100 90 Q 105 95 110 90" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="65" y1="80" x2="85" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="65" y1="90" x2="85" y2="88" stroke="#333" stroke-width="1.5"/>
  <line x1="115" y1="82" x2="135" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="115" y1="88" x2="135" y2="90" stroke="#333" stroke-width="1.5"/>

  <!-- Cat legs -->
  <ellipse cx="80" cy="155" rx="8" ry="15" fill="#FF6B35" stroke="#333" stroke-width="2"/>
  <ellipse cx="120" cy="155" rx="8" ry="15" fill="#FF6B35" stroke="#333" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="80" cy="168" rx="10" ry="6" fill="#333"/>
  <ellipse cx="120" cy="168" rx="10" ry="6" fill="#333"/>

  <!-- Cat tail -->
  <path d="M 140 125 Q 160 115 170 140 Q 165 155 150 150" stroke="#333" stroke-width="2" fill="#FF6B35"/>
</svg>